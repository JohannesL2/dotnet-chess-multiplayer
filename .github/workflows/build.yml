name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore chessapp.slnx
      - run: dotnet format chessapp.slnx whitespace --verify-no-changes --no-restore
      - run: dotnet build chessapp.slnx --configuration Release --no-restore
